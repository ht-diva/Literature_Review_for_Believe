---
# common parameters
n_cores: &cores 4

# This is an ordered dict that contains the order in which the steps are run.
run_sequence: !!omap
  - 1: 'fill_data'
  - 2: 'basic_check'
  - 3: 'infer_build'
  - 4: 'harmonize'
  - 5: 'sort_alphabetically'
  - 6: 'write_tsv'


steps:
  fill_data: # see https://cloufield.github.io/gwaslab/Conversion/#fill_data
    params:
      run: True
    gl_params:
      to_fill: ['MLOG10P']
      overwrite: False
      extreme: True
  basic_check: # see https://cloufield.github.io/gwaslab/Standardization/
    params:
      run: True
    gl_params:
      threads: *cores
      normalize: True
      fix_id_kwargs:
        fixid: True
        overwrite: True
  infer_build: # see https://cloufield.github.io/gwaslab/InferBuild/
    params:
      run: true
  harmonize: # see https://cloufield.github.io/gwaslab/Harmonization/
    params:
      run: True
    gl_params:
      basic_check: False
      ref_seq: "/group/diangelantonio/public_data/liftOver/hg38.nochr.fa"
      ref_rsid_vcf: "/group/diangelantonio/public_data/liftOver/All_20180418.vcf.gz"
      threads: *cores
  sort_alphabetically:
    params:
      run: True
    gl_params:
      threads: *cores
  write_tsv:
    params:
      run: True
      workspace_subfolder: False
    gl_params:
      fmt: "gwaslab"
      xymt_number: True
      to_csvargs: {}


# Filename transformation, e.g. pqtl_sun.tsv
filename_mask: [ True, False]
filename_sep: '.'

# IO
root_path: "results"
log_filename: "gwaspipe.log"
formatbook_path: "formatbook.json"